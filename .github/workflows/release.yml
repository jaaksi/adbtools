# 打 tag(如 v0.1.2)即触发:多平台并行构建 → 汇总到同一个草稿 Release → 全部成功后正式发布。
# 本项目未启用 Tauri 自动更新(无 updater 插件),因此无需签名密钥等任何 secret。
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch: # 也可在 Actions 页手动从某个 tag 触发

permissions:
  contents: write # 创建 / 发布 Release 需要

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # ① 多平台并行构建,产物上传到同一个草稿 Release
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple 芯片(arm64)
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest # Intel 芯片(x86_64,在 arm64 runner 上交叉编译)
            args: '--target x86_64-apple-darwin'
          # 暂不构建 Linux;需要时取消下面两行注释(并放开下方「安装 Linux 构建依赖」步骤)
          # - platform: ubuntu-22.04 # 用 22.04 而非最新版,glibc/WebKitGTK 兼容性更好
          #   args: ''
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6

      # 暂不构建 Linux;需要时取消注释(配合矩阵里的 ubuntu 项一起放开)
      # - name: 安装 Linux 构建依赖
      #   if: matrix.platform == 'ubuntu-22.04'
      #   run: |
      #     sudo apt-get update
      #     sudo apt-get install -y \
      #       libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
      #       patchelf libgtk-3-dev build-essential file libxdo-dev libssl-dev

      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # macOS 出双架构需要同时具备两个目标
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'ADB Tools ${{ github.ref_name }}'
          releaseDraft: true # 先建草稿,等所有平台都齐了再由 ② 发布,避免半成品 Release
          prerelease: false
          args: ${{ matrix.args }}

  # ② 全部平台构建完成后,把草稿 Release 正式发布
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 发布 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft=false
