# push / PR 到 master 时做快速检查:前端类型检查 + 构建、Rust clippy。
# 只做校验不产出安装包;发版(打 tag)走 release.yml。
name: ci

on:
  push:
    branches: [master]
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    branches: [master]
    paths-ignore: ['docs/**', '**.md']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true # 同分支新提交时取消旧的检查,省配额

jobs:
  # ① 前端:vue-tsc 类型检查 + vite 构建(pnpm build 包含这两步)
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  # ② Rust:clippy 静态检查(用 ubuntu runner,比 macOS 快且不占 10 倍配额)
  rust:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Linux 构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libgtk-3-dev build-essential file libxdo-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # tauri-build 编译时要求 frontendDist(../dist)存在,CI 里不跑前端产物,建空目录即可
      - run: mkdir -p dist

      # 存量代码尚有少量 clippy 警告,暂不加 `-- -D warnings`;清零后可收紧为出警告即失败
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets
